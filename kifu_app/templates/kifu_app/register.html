{% extends 'kifu_app/base.html' %}

{% block title %}新規登録 | 碁友会{% endblock %}

{% block nav %}{% endblock %}

{% block app_content %}
<div class="header">
  <div class="header-left">
    <div class="back" onclick="history.back()"><i class="fa-solid fa-angle-left"></i></div>
  </div>
  <div class="header-center">
    <div class="title-main">新規登録</div>
  </div>
  <div class="header-right"></div>
</div>

<div class="bottom" style="background:#fff;color:#000;flex:1;overflow-y:auto;padding:32px 24px;padding-bottom:60px;">
  {% if messages %}
  {% for message in messages %}
  <div style="background:#fee;color:#c00;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;">
    {{ message }}
  </div>
  {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">ユーザー名 <span class="required">*</span></label>
      <input type="text" name="username" class="form-input" autofocus required>
    </div>
    <div class="form-group">
      <label class="form-label">メールアドレス <span class="required">*</span></label>
      <input type="email" name="email" class="form-input" required>
    </div>
    <div class="form-group">
      <label class="form-label">パスワード <span class="required">*</span></label>
      <input type="password" name="password" class="form-input" required>
      <div style="font-size:11px;color:#999;margin-top:4px;">8文字以上</div>
    </div>
    <div class="form-group">
      <label class="form-label">パスワード（確認） <span class="required">*</span></label>
      <input type="password" name="password2" class="form-input" required>
    </div>
    <button type="submit" class="send-btn submit-btn">登録する</button>
  </form>

  <div style="text-align:center;margin-top:24px;font-size:13px;color:#666;">
    すでにアカウントをお持ちの方は
    <a href="{% url 'kifu_app:login' %}" style="color:#000;font-weight:bold;">ログイン</a>
  </div>
</div>
{% endblock %}
