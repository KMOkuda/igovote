{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タグ検索結果</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="{% static 'kifu_app/css/style.css' %}">
  
  <style>
    /* 1. ページタイトル部分の高さを別画面（min-height: 60px）と完全に統一 */
    .header.search-header {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      padding: 12px;
      min-height: 60px;
      height: auto;
    }
    
    .header-search-title {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #F9F9F9;
      line-height: 1.3;
    }

    /* 2. 検索欄の縦幅をヘッダー（タイトル部分）と同じボリューム（40px）に調整 */
    .search-bar-wrapper {
      position: relative;
      width: 100%;
    }

    .search-bar-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 14px;
    }

    .search-input {
      width: 100%;
      height: 40px; /* 押しやすく存在感のある高さ */
      background: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 0 12px 0 38px;
      font-size: 14px;
      color: #000000;
      outline: none;
    }

    /* 4. 検索欄の下のエリアの背景色を、別画面のコメント欄と同じ純白（#ffffff）に統一 */
    /* style.cssの overflow: hidden を上書きしてスクロールを正常化します */
    .bottom.search-results {
      background: #ffffff; 
      color: #000000;
      overflow-y: auto; 
      flex: 1;
      padding: 10px 0 80px 0; /* 下部のナビ見切れ防止余白を含む */
    }

    /* 5. 四角いカード枠を廃止し、グレーの区切り線に変更（両端に空間をあける設計） */
    .post-card {
      background: transparent;
      color: #000000;
      padding: 16px 20px; /* 左右の 20px が、線の届かない「空間」になります */
      display: flex;
      gap: 14px;
      border-bottom: 1px solid #eee; /* グレーの区切り線 */
    }

    /* 最後の結果の線は非表示にしてスッキリさせる */
    .post-card:last-child {
      border-bottom: none;
    }

    /* ミニ碁盤エリア */
    .goban-mini {
      width: 85px;
      height: 85px;
      background-color: #e4a853;
      background-image: 
        radial-gradient(circle, #000 1px, transparent 1px),
        linear-gradient(to right, rgba(0,0,0,0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.15) 1px, transparent 1px);
      background-size: 100% 100%, 10% 100%, 100% 10%;
      border-radius: 6px;
      position: relative;
      flex-shrink: 0;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
    }

    /* 簡易的な碁石の配置 */
    .mini-stone {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.4);
    }
    .mini-stone.black { background: #111; }
    .mini-stone.white { background: #fff; border: 0.5px solid #ccc; }

    /* カード右側の情報エリア */
    .post-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 3. 1行目にプロフィール画像（丸） ＋ 右に棋譜タイトルを表示 */
    .post-header-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    /* style.css の .avatar（36px）をベースに検索結果用に調整 */
    .post-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
    }

    .post-title {
      font-size: 13px;
      font-weight: bold;
      line-height: 1.4;
      color: #000000;
      margin: 0;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2; /* タイトルが長すぎても2行で綺麗に収める */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* タグ関連 */
    .tag-list {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .tag-item {
      background: #000000; /* move-chipに倣い、引き締まった黒を採用 */
      color: #FFFFFF;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .post-footer {
      display: flex;
      justify-content: flex-end; /* 日付を右寄せ */
      align-items: center;
    }

    .post-date {
      font-size: 10px;
      color: #666666;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header search-header">
      <div class="header-search-title">タグ検索結果</div>
      <div class="search-bar-wrapper">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" class="search-input" value="詰め碁, 研究" placeholder="タグを検索...">
      </div>
    </div>

    <div class="bottom search-results">

      <div class="post-card">
        <div class="goban-mini">
          <div class="mini-stone black" style="top: 20%; left: 40%;"></div>
          <div class="mini-stone white" style="top: 30%; left: 50%;"></div>
          <div class="mini-stone black" style="top: 40%; left: 30%;"></div>
          <div class="mini-stone white" style="top: 50%; left: 60%;"></div>
        </div>
        <div class="post-info">
          <div>
            <div class="post-header-row">
              <div class="post-avatar"></div>
              <h3 class="post-title">[田中五段] さんが 本因坊戦 第6局</h3>
            </div>
            <div class="tag-list">
              <span class="tag-item">#プロ棋譜</span>
              <span class="tag-item">#第6局</span>
              <span class="tag-item">#研究</span>
            </div>
          </div>
          <div class="post-footer">
            <span class="post-date"><i class="fa-regular fa-calendar"></i> 2024.11.01</span>
          </div>
        </div>
      </div>

      <div class="post-card">
        <div class="goban-mini">
          <div class="mini-stone black" style="top: 50%; left: 40%;"></div>
          <div class="mini-stone white" style="top: 40%; left: 40%;"></div>
          <div class="mini-stone black" style="top: 60%; left: 50%;"></div>
        </div>
        <div class="post-info">
          <div>
            <div class="post-header-row">
              <div class="post-avatar"></div>
              <h3 class="post-title">私の布石コツ（詰め碁・基礎研究編）</h3>
            </div>
            <div class="tag-list">
              <span class="tag-item">#布石</span>
              <span class="tag-item">#詰め碁</span>
              <span class="tag-item">#研究</span>
            </div>
          </div>
          <div class="post-footer">
            <span class="post-date"><i class="fa-regular fa-calendar"></i> 2024.11.05</span>
          </div>
        </div>
      </div>

      <div class="post-card">
        <div class="goban-mini">
          <div class="mini-stone white" style="top: 20%; left: 70%;"></div>
          <div class="mini-stone black" style="top: 30%; left: 70%;"></div>
        </div>
        <div class="post-info">
          <div>
            <div class="post-header-row">
              <div class="post-avatar"></div>
              <h3 class="post-title">[鈴木五段] 最新AIに基づいたコウの局地戦検討</h3>
            </div>
            <div class="tag-list">
              <span class="tag-item">#AI</span>
              <span class="tag-item">#コウ</span>
              <span class="tag-item">#詰め碁</span>
            </div>
          </div>
          <div class="post-footer">
            <span class="post-date"><i class="fa-regular fa-calendar"></i> 2024.11.08</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="nav" id="nav">
    <div class="nav-item" onclick="location.href='/'">
      <i class="fa-solid fa-house"></i>
      <span>ホーム</span>
    </div>
    <div class="nav-item" style="color: #000; font-weight: bold;">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>検索</span>
    </div>
    <div class="nav-item">
      <i class="fa-solid fa-square-plus"></i>
      <span>投稿</span>
    </div>
    <div class="nav-item">
      <i class="fa-solid fa-user"></i>
      <span>マイページ</span>
    </div>
  </div>

</body>
</html>
